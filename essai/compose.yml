# Essai des images dans les conditions du serveur : comptes sans droits, sans capacités, mémoire bornée, base et Redis
# sur un réseau interne. Plus un récepteur de webhooks et une boîte mail de test (mailpit), propres à l'essai.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caldiy
      POSTGRES_PASSWORD: ${PG_MDP}
      POSTGRES_DB: caldiy
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caldiy -d caldiy"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_MDP}"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]
  recepteur:
    image: python:3.12-alpine
    command: ["python", "-u", "/r.py"]
    volumes: ["./recepteur.py:/r.py:ro", "./recu:/recu"]
  web:
    image: caldiy-web:essai
    user: "1000:1000"
    env_file: [web.env]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1536m
    pids_limit: 512
  api:
    image: caldiy-api:essai
    env_file: [api.env]
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 256
